name: Tourfolio CI/CD Auto Deploy

on:
  push:
    branches:
      - main  # main 브랜치에 push 할 때만 실행 (master면 master로 수정)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 자바 17 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드 (테스트 실행X, jar 파일 생성)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. 빌드된 파일 서버로 전송
      - name: Transfer JAR File
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "build/libs/*.jar"
          target: "~/app"
          strip_components: 2

      # 5. 서버 접속해서 기존 앱 끄고 새 앱 실행
      - name: SSH Server & Run App
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # 기존 켜져 있던 백엔드 꺼주기
            PID=$(pgrep -f tourfolio)
            if [ -n "$PID" ]; then
              kill -15 $PID
              sleep 5
            fi

            # 새로 온 jar 실행하기
            nohup java -jar ~/app/*.jar > ~/app.log 2>&1 &