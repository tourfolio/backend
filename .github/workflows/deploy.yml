name: Deploy to Server

on:
  push:
    branches: [ "main" ] # 또는 사용하는 브랜치명 (예: master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Java 버전 설정 (프로젝트 자바 버전에 맞게 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 실행 권한 부여 및 빌드 (JAR 파일 생성)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 1. 서버로 JAR 파일 전송 (SCP)
      - name: Copy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 2. 서버 접속 후 애플리케이션 재실행 (SSH)
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER
        }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # 기존 8080 포트 사용 프로세스 종료 (에러 방지용 || true)
            fuser -k 8080/tcp || true
            
            # 새 JAR 백그라운드 실행
            nohup java -jar /home/ubuntu/app/*.jar > /home/ubuntu/app/app.log 2>&1 &