version: '3.8'

services:
  tourfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tourfolio-app
    ports:
      - "8000:8000"
    environment:
      # Server Configuration
      - SERVER_PORT=${SERVER_PORT:-8000}
      
      # Database Configuration
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:mem:tourfoliodb}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.h2.Driver}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      
      # H2 Console Configuration
      - SPRING_H2_CONSOLE_ENABLED=${SPRING_H2_CONSOLE_ENABLED:-true}
      - SPRING_H2_CONSOLE_PATH=${SPRING_H2_CONSOLE_PATH:-/h2-console}
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=${SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS:-true}
      
      # JPA Configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-true}
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-true}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.H2Dialect}
      
      # OpenAPI Configuration
      - OPENAPI_SERVICE_KEY=${OPENAPI_SERVICE_KEY}
      
      # API Endpoints
      - ENDPOINT_DEMAND=${ENDPOINT_DEMAND}
      - ENDPOINT_RESDEM=${ENDPOINT_RESDEM}
      - ENDPOINT_VISITOR=${ENDPOINT_VISITOR}
      - ENDPOINT_FORECAST=${ENDPOINT_FORECAST}
      
      # Application Configuration
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME:-tourfolio}
      - SERVER_SERVLET_ENCODING_CHARSET=${SERVER_SERVLET_ENCODING_CHARSET:-UTF-8}
      - SERVER_SERVLET_ENCODING_FORCE=${SERVER_SERVLET_ENCODING_FORCE:-true}
      - SPRING_HTTP_ENCODING_CHARSET=${SPRING_HTTP_ENCODING_CHARSET:-UTF-8}
      - SPRING_HTTP_ENCODING_FORCE=${SPRING_HTTP_ENCODING_FORCE:-true}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - tourfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  tourfolio-network:
    driver: bridge
