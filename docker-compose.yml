version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tourfolio-app
    environment:
      # Swagger Configuration
      - SWAGGER_SERVER_URL=http://tourfolio.kr

      # Server Configuration
      - SERVER_PORT=${SERVER_PORT:-8000}

      # Database Configuration (MySQL/RDS)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}

      # JPA Configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-true}
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-true}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect

      # OpenAPI Configuration
      - OPENAPI_SERVICE_KEY=${OPENAPI_SERVICE_KEY}

      # API Endpoints
      - ENDPOINT_DEMAND=${ENDPOINT_DEMAND}
      - ENDPOINT_RESDEM=${ENDPOINT_RESDEM}
      - ENDPOINT_VISITOR=${ENDPOINT_VISITOR}
      - ENDPOINT_FORECAST=${ENDPOINT_FORECAST}

      # Application Configuration
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME:-tourfolio}
      - SERVER_SERVLET_ENCODING_CHARSET=UTF-8
      - SERVER_SERVLET_ENCODING_FORCE=true
      - SPRING_HTTP_ENCODING_CHARSET=UTF-8
      - SPRING_HTTP_ENCODING_FORCE=true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - tourfolio-network

  nginx:
    image: nginx:alpine
    container_name: tourfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - tourfolio-network

networks:
  tourfolio-network:
    driver: bridge