services:
  tourfolio:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    container_name: tourfolio-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - tourfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  tourfolio-network:
    driver: bridge
