spring:
  application:
    name: tourfolio
  
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8000}

swagger:
  server-url: ${SWAGGER_SERVER_URL:https://tourfolio.kr}

openapi:
  service:
    key: ${OPENAPI_SERVICE_KEY:}

tour:
  api:
    service-key: ${TOUR_API_SERVICE_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr}

endpoint:
  demand: ${ENDPOINT_DEMAND:https://apis.data.go.kr/B551011/AreaTarDemDsService}
  resdem: ${ENDPOINT_RESDEM:https://apis.data.go.kr/B551011/AreaTarResDemService}
  visitor: ${ENDPOINT_VISITOR:https://apis.data.go.kr/B551011/DataLabService}
  forecast: ${ENDPOINT_FORECAST:https://apis.data.go.kr/B551011/TatsCnctrRateService}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://100.30.180.234:8000/api/v1/auth/kakao/callback}

logging:
  level:
    root: INFO
    com.tourfolio.app: DEBUG   # 디버깅을 위해 DEBUG 레벨로 상향
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # SQL 파라미터 확인용
org:
  hibernate:
    SQL: DEBUG
    type:
      descriptor:
        sql:
          BasicBinder: TRACE
